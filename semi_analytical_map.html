<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Satellite semi-analytical results viewer</title><link rel="stylesheet" href="vendor/leaflet.css"><script src="vendor/leaflet.js"></script><script src="semi_previews/manifest.js"></script><script src="planet_previews/manifest.js"></script><script src="viewer_data/sentinel_values.js"></script><script src="viewer_data/planet_values.js"></script><script src="tools/export_map.js"></script>
<style>*{box-sizing:border-box}html,body{height:100%;margin:0;font:15px Arial;color:#17384c}header{height:74px;background:#123c60;color:#fff;padding:10px 18px}h1{font-size:20px;margin:0 0 9px}header a{color:#def5ff;margin-right:16px}.layout{display:grid;grid-template-columns:325px 1fr;height:calc(100% - 74px)}aside{padding:17px;background:#fff;overflow:auto;border-right:1px solid #cfdee6}#map{height:100%;background:#dce9ee}label{display:block;font-weight:bold;margin:12px 0}select,input[type=range]{display:block;width:100%;margin-top:5px;padding:8px}.legend,.value{padding:13px;background:#f1f7f9;border:1px solid #ccdde4;border-radius:9px;margin-top:14px}.bar{height:15px;border-radius:4px;margin:9px 0}.labels{display:flex;justify-content:space-between;font-size:12px}.row{display:flex;align-items:center;gap:8px;margin:7px 0}.swatch{width:15px;height:15px;border:1px solid #79909d;display:inline-block}.note{font-size:13px;line-height:1.4;color:#587283}.save{width:100%;margin-top:14px;padding:10px;border:0;border-radius:7px;background:#147f78;color:#fff;font-weight:bold;cursor:pointer}@media(max-width:700px){header{height:auto}.layout{display:block;height:auto}#map{height:68vh}}</style></head>
<body><header><h1>Satellite semi-analytical results viewer</h1><nav><a href="index.html">Home</a><a href="inventory.html">Inventory</a><a href="semi_analytical_concept.html">Concept</a><a href="glint_correction.html">Glint correction</a></nav></header><div class="layout"><aside><p class="note">Choose a sensor, scene, and product. Click a colored grid cell to inspect its result.</p><label>Sensor<select id="sensor"><option value="sentinel">Sentinel-2</option><option value="planet">Planet Dove</option></select></label><label>Scene<select id="scene"></select></label><label>Product<select id="product"></select></label><label>Overlay opacity<input id="opacity" type="range" min="0" max="1" step=".05" value=".8"></label><div class="legend"><strong id="legendTitle">Legend</strong><div id="legendBody"></div></div><div class="value"><strong>Clicked grid value</strong><div id="pixelValue" class="note">Click inside the result overlay.</div></div><button id="saveMap" class="save">Save map with legend</button></aside><div id="map"></div></div>
<script>
const $=id=>document.getElementById(id),sentinel=window.SENTINEL_SCENES||[],planet=window.PLANET_RESULT?[window.PLANET_RESULT]:[];
const specs={depth_m:['Estimated depth','m'],sand_fraction:['Sand fraction',''],seagrass_fraction:['Seagrass fraction',''],habitat:['Habitat class',''],rrs_rmse:['Rrs RMSE','sr⁻¹'],relative_cost:['Relative model cost','']};
const map=L.map('map').setView([-5.802,106.515],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);let overlay;
function scenes(){return $('sensor').value==='sentinel'?sentinel:planet}function image(layer){return typeof layer==='string'?layer:layer.image}function products(){const s=scenes()[+$('scene').value];return s?Object.keys(s.layers):[]}
function fillScenes(){$('scene').innerHTML=scenes().map((s,i)=>'<option value="'+i+'">'+s.label+'</option>').join('');fillProducts()}function fillProducts(){$('product').innerHTML=products().map(k=>'<option value="'+k+'">'+specs[k][0]+'</option>').join('');draw(true)}
function legend(k){let h='';if(k==='depth_m')h='<div class="bar" style="background:linear-gradient(90deg,#30123b,#4145ab,#2aa7d6,#39d353,#f4e61e,#f47918,#7a0403)"></div><div class="labels"><span>0 m</span><span>3</span><span>6</span><span>9</span><span>12</span><span>15 m</span></div><p class="note">Black: 15 m or deeper.</p>';else if(k==='habitat')h='<div class="row"><i class="swatch" style="background:#edc15b"></i>Sand ≥70%</div><div class="row"><i class="swatch" style="background:#16894b"></i>Seagrass ≥70%</div><div class="row"><i class="swatch" style="background:#893faf"></i>Mixed</div><div class="row"><i class="swatch" style="background:#87949a"></i>Unclassified</div>';else if(k==='rrs_rmse'||k==='relative_cost')h='<div class="bar" style="background:linear-gradient(90deg,#440154,#31688e,#35b779,#fde725)"></div><div class="labels"><span>Low</span><span>High</span></div>';else{const c=k==='sand_fraction'?'#fff7bc,#fec44f,#8c2d04':'#ffffcc,#78c679,#005a32';h='<div class="bar" style="background:linear-gradient(90deg,'+c+')"></div><div class="labels"><span>0</span><span>0.25</span><span>0.5</span><span>0.75</span><span>1</span></div><p class="note"><i class="swatch" style="background:#de28aa"></i> Below 0 &nbsp; <i class="swatch" style="background:#1769ff"></i> Above 1</p>'}$('legendTitle').textContent=specs[k][0]+' legend';$('legendBody').innerHTML=h}
function draw(fit=false){const s=scenes()[+$('scene').value],k=$('product').value;if(!s||!k)return;if(overlay)map.removeLayer(overlay);const e=s.extent,b=[[e[1],e[0]],[e[3],e[2]]];overlay=L.imageOverlay(image(s.layers[k]),b,{opacity:+$('opacity').value}).addTo(map);if(fit)map.fitBounds(b);legend(k);$('pixelValue').textContent='Click inside the result overlay.'}
function decode(g){if(!g.values){const b=atob(g.data),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);g.values=new Float32Array(u.buffer)}return g.values}
map.on('click',e=>{const sensor=$('sensor').value,s=scenes()[+$('scene').value],k=$('product').value,all=sensor==='sentinel'?window.SENTINEL_VALUES:window.PLANET_VALUES,g=all&&all[s.id]&&all[s.id][k];if(!g)return;const x=e.latlng.lng,y=e.latlng.lat,a=g.extent;if(x<a[0]||x>a[2]||y<a[1]||y>a[3])return;const c=Math.min(g.width-1,Math.floor((x-a[0])/(a[2]-a[0])*g.width)),r=Math.min(g.height-1,Math.floor((a[3]-y)/(a[3]-a[1])*g.height)),v=decode(g)[r*g.width+c];let shown=Number.isFinite(v)?(k==='habitat'?({0:'Unclassified',1:'Sand',2:'Seagrass',3:'Mixed'}[Math.round(v)]||v):v.toFixed(k==='depth_m'?2:4)):'NoData';$('pixelValue').innerHTML='<b>'+shown+(Number.isFinite(v)&&specs[k][1]?' '+specs[k][1]:'')+'</b><br>Row '+(r+1)+', column '+(c+1)+'<br>'+y.toFixed(6)+', '+x.toFixed(6);L.popup().setLatLng(e.latlng).setContent(specs[k][0]+': <b>'+shown+'</b>').openOn(map)});
$('sensor').onchange=fillScenes;$('scene').onchange=fillProducts;$('product').onchange=()=>draw(false);$('opacity').oninput=()=>overlay&&overlay.setOpacity(+$('opacity').value);$('saveMap').onclick=()=>{const s=scenes()[+$('scene').value],k=$('product').value;saveResultMap({imageUrl:image(s.layers[k]),scene:s.id,product:k,productLabel:specs[k][0],sensorLabel:$('sensor').selectedOptions[0].textContent}).catch(e=>alert(e.message))};fillScenes();
</script></body></html>
