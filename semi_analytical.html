<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interactive semi-analytical results</title><style>*{box-sizing:border-box}body{margin:0;font:15px Arial;background:#edf4f7;color:#16354a}header{background:#123c60;color:white;padding:15px 24px}header a{color:#e3f8ff;margin-right:20px}h1{margin:0 0 12px;font-size:22px}.layout{display:grid;grid-template-columns:340px 1fr;height:calc(100vh - 92px)}aside{overflow:auto;background:white;padding:20px;border-right:1px solid #cbdce4}main{padding:20px;overflow:auto;display:flex;align-items:center;justify-content:center}.viewer{width:100%;height:100%;display:grid;place-items:center;background:#102b3e;border-radius:12px;overflow:hidden;position:relative}.viewer img{max-width:100%;max-height:100%;object-fit:contain;transition:transform .15s}.badge{position:absolute;bottom:10px;left:10px;background:#fffE;padding:7px 10px;border-radius:6px}label{display:block;margin:14px 0;font-weight:bold}select,input[type=range]{display:block;width:100%;margin-top:6px;padding:8px}button{padding:8px 12px;margin:4px;border:1px solid #91b5c5;background:#fff;border-radius:6px;cursor:pointer}.active{background:#147f78;color:white}p{line-height:1.5}.meta{background:#eff7f8;padding:12px;border-radius:8px}@media(max-width:700px){.layout{display:block;height:auto}aside{border:0}main{height:65vh}}</style></head><body><header><h1>Pacific Island Project · satellite viewer</h1><a href="index.html">Home</a><a href="inventory.html">Inventory</a><a href="semi_analytical.html">Semi-analytical</a><a href="glint_correction.html">Glint correction</a></header><div class="layout"><aside><h2>Satellite-derived results</h2><p>Explore the Sentinel-2 model output images by scene and product. These are model estimates; no survey validation data is included.</p><label>Scene<select id="scene"></select></label><label>Product<select id="product"><option value="depth_m">Estimated depth</option><option value="sand_fraction">Sand fraction</option><option value="seagrass_fraction">Seagrass fraction</option><option value="habitat">Habitat class</option></select></label><div><button id="prev">Previous scene</button><button id="next">Next scene</button></div><label>Zoom<input type="range" id="zoom" min="1" max="4" step="0.1" value="1"></label><div class="meta">Python source: <a href="semi_analytical/code_v3/src/run_all.py">main pipeline</a> · <a href="semi_analytical/code_v3/src/model.py">optical model</a></div></aside><main><div class="viewer"><img id="preview" alt="Selected Sentinel-2 derived product"><span class="badge" id="caption"></span></div></main></div><script>const scenes=["20200728_S2A", "20210424_S2A", "20210608_S2B", "20210718_S2B", "20210812_S2A", "20220414_S2B", "20220708_S2A", "20230419_S2B", "20230723_S2A", "20230817_S2B", "20230916_S2B", "20231220_S2A", "20240413_S2B", "20240528_S2A", "20240727_S2A", "20240811_S2B", "20240925_S2A", "20241025_S2A", "20250528_S2B", "20250612_S2C", "20250724_S2A", "20250826_S2B", "20250915_S2B", "20260709_S2A", "20260808_S2A"];const $=id=>document.getElementById(id);$('scene').innerHTML=scenes.map(s=>`<option>${s}</option>`).join('');function draw(){$('preview').src=`semi_previews/${$('scene').value}_${$('product').value}.png`;$('preview').style.transform=`scale(${$('zoom').value})`;$('caption').textContent=`${$('scene').value} · ${$('product').selectedOptions[0].textContent}`}['scene','product','zoom'].forEach(x=>$(x).addEventListener('input',draw));for(let [id,d] of [['prev',-1],['next',1]])$(id).onclick=()=>{$('scene').selectedIndex=($('scene').selectedIndex+d+scenes.length)%scenes.length;draw()};draw();</script></body></html>
