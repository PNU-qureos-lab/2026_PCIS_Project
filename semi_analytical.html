<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interactive semi-analytical results</title><style>*{box-sizing:border-box}body{margin:0;font:15px Arial;background:#edf4f7;color:#16354a}header{background:#123c60;color:white;padding:15px 24px}header a{color:#e3f8ff;margin-right:20px}h1{margin:0 0 12px;font-size:22px}.layout{display:grid;grid-template-columns:340px 1fr;height:calc(100vh - 92px)}aside{overflow:auto;background:white;padding:20px;border-right:1px solid #cbdce4}main{padding:20px;overflow:auto;display:flex;align-items:center;justify-content:center}.viewer{width:100%;height:100%;display:grid;place-items:center;background:#102b3e;border-radius:12px;overflow:hidden;position:relative}.viewer img{max-width:100%;max-height:100%;object-fit:contain;transition:transform .15s}.badge{position:absolute;bottom:10px;left:10px;background:#fffE;padding:7px 10px;border-radius:6px}label{display:block;margin:14px 0;font-weight:bold}select,input[type=range]{display:block;width:100%;margin-top:6px;padding:8px}button{padding:8px 12px;margin:4px;border:1px solid #91b5c5;background:#fff;border-radius:6px;cursor:pointer}.active{background:#147f78;color:white}p{line-height:1.5}.meta{background:#eff7f8;padding:12px;border-radius:8px}@media(max-width:700px){.layout{display:block;height:auto}aside{border:0}main{height:65vh}}.legend{margin:16px 0;padding:14px;background:#f3f8fa;border:1px solid #cbdce4;border-radius:8px}.legend-bar{height:14px;border-radius:4px;margin:8px 0}.legend-labels{display:flex;justify-content:space-between;font-size:12px}.legend-row{display:flex;align-items:center;gap:8px;margin:6px 0}.swatch{display:inline-block;width:14px;height:14px;border:1px solid #6f8490}.legend small{color:#526e7e}</style></head><body><header><h1>Pacific Island Project · satellite viewer</h1><a href="index.html">Home</a><a href="inventory.html">Inventory</a><a href="semi_analytical.html">Semi-analytical</a><a href="glint_correction.html">Glint correction</a></header><div class="layout"><aside><h2>Satellite-derived results</h2><p>Explore the Sentinel-2 model output images by scene and product. Explore model-estimated depth and habitat products.</p><label>Scene<select id="scene"></select></label><label>Product<select id="product"><option value="depth_m">Estimated depth</option><option value="sand_fraction">Sand fraction</option><option value="seagrass_fraction">Seagrass fraction</option><option value="habitat">Habitat class</option></select></label><div><button id="prev">Previous scene</button><button id="next">Next scene</button></div><label>Zoom<input type="range" id="zoom" min="1" max="4" step="0.1" value="1"></label><div class="legend"><b id="legendTitle">Legend</b><div id="legendBody"></div></div><div class="meta">Python source: <a href="semi_analytical/code_v3/src/run_all.py">main pipeline</a> · <a href="semi_analytical/code_v3/src/model.py">optical model</a></div></aside><main><div class="viewer"><img id="preview" alt="Selected Sentinel-2 derived product"><span class="badge" id="caption"></span></div></main></div><script>const scenes=["20200728_S2A", "20210424_S2A", "20210608_S2B", "20210718_S2B", "20210812_S2A", "20220414_S2B", "20220708_S2A", "20230419_S2B", "20230723_S2A", "20230817_S2B", "20230916_S2B", "20231220_S2A", "20240413_S2B", "20240528_S2A", "20240727_S2A", "20240811_S2B", "20240925_S2A", "20241025_S2A", "20250528_S2B", "20250612_S2C", "20250724_S2A", "20250826_S2B", "20250915_S2B", "20260709_S2A", "20260808_S2A"];const $=id=>document.getElementById(id);$('scene').innerHTML=scenes.map(s=>`<option>${s}</option>`).join('');function draw(){$('preview').src=`semi_previews/${$('scene').value}_${$('product').value}.png`;$('preview').style.transform=`scale(${$('zoom').value})`;$('caption').textContent=`${$('scene').value} · ${$('product').selectedOptions[0].textContent}`;let k=$('product').value;$('legendTitle').textContent=$('product').selectedOptions[0].textContent+' legend';$('legendBody').innerHTML=k==='depth_m'?'<div class="legend-bar" style="background:linear-gradient(90deg,#30123b,#4145ab,#2aa7d6,#39d353,#f4e61e,#f47918,#7a0403)"></div><div class="legend-labels"><span>0 m</span><span>3</span><span>6</span><span>9</span><span>12</span><span>15 m</span></div><small>Black: 15 m or deeper. Transparent: outside model mask.</small>':k==='habitat'?'<div class="legend-row"><i class="swatch" style="background:#edc15b"></i>Sand ≥70%</div><div class="legend-row"><i class="swatch" style="background:#16894b"></i>Seagrass ≥70%</div><div class="legend-row"><i class="swatch" style="background:#893faf"></i>Mixed</div><div class="legend-row"><i class="swatch" style="background:#87949a"></i>Unclassified</div><small>Transparent: NoData.</small>':k==='sand_fraction'?'<div class="legend-bar" style="background:linear-gradient(90deg,#fff7bc,#fec44f,#8c2d04)"></div><div class="legend-labels"><span>0</span><span>0.25</span><span>0.5</span><span>0.75</span><span>1</span></div><small>Magenta: below 0. Orange: above 1. Transparent: missing or invalid.</small>':'<div class="legend-bar" style="background:linear-gradient(90deg,#ffffcc,#78c679,#005a32)"></div><div class="legend-labels"><span>0</span><span>0.25</span><span>0.5</span><span>0.75</span><span>1</span></div><small>Magenta: below 0. Orange: above 1. Transparent: missing or invalid.</small>'}['scene','product','zoom'].forEach(x=>$(x).addEventListener('input',draw));for(let [id,d] of [['prev',-1],['next',1]])$(id).onclick=()=>{$('scene').selectedIndex=($('scene').selectedIndex+d+scenes.length)%scenes.length;draw()};draw();</script></body></html>
